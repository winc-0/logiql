# 仓配自助问数 —— 一键启动全部中间件
#
# 用法：
#   cp .env.example .env      # 先配置账号密码
#   docker compose up -d      # 启动（首次拉取镜像约 5-10 分钟）
#   docker compose ps         # 查看状态
#   docker compose down       # 停止（数据保留在 volume 中）
#
# 服务端口：MySQL 3306 / Elasticsearch 9200 / Kibana 5601 / Qdrant 6333 / Embedding 8081
#
# 说明：
#   - 所有服务名均带 zhishu- 前缀，避免与机器上已有的同名容器冲突
#   - MySQL 首次启动会自动执行 mysql/*.sql 初始化元数据库(meta)与数据仓库(dw)
#   - Embedding 默认从 HuggingFace 拉取 BAAI/bge-large-zh-v1.5；
#     若已下载到本地，可取消下面 volumes 的注释改为挂载本地模型目录

services:

  mysql:
    image: mysql:8.0
    container_name: zhishu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_USER: ${MYSQL_USER:-zhishu}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    build: ./elasticsearch
    container_name: zhishu-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # ES 是内存大户，默认会按宿主机内存比例分配堆。显式限制，避免挤爆小内存机器。
      # 内存紧张时可降到 512m；充裕时可提到 2g。
      ES_JAVA_OPTS: "${ES_JAVA_OPTS:--Xms1g -Xmx1g}"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  kibana:
    image: kibana:8.19.10
    container_name: zhishu-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.16
    container_name: zhishu-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: zhishu-embedding
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      MODEL_ID: ${EMBEDDING_MODEL_ID:-BAAI/bge-large-zh-v1.5}
      MAX_CONCURRENT_REQUESTS: "16"
      MAX_BATCH_TOKENS: "16384"
      # 镜像站：容器内直连 huggingface.co 通常不通，默认走 hf-mirror
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      HF_HUB_OFFLINE: "0"
    volumes:
      # 挂载本地已下载的模型可免去容器内 1.3G 的下载（hf 镜像站常因缺少
      # Content-Range 响应头而下载失败）。启用方式：
      #   1) 把模型放到 docker/embedding/bge-large-zh-v1.5/
      #   2) .env 中设置 EMBEDDING_MODEL_ID=/models/bge-large-zh-v1.5
      - ./embedding/bge-large-zh-v1.5:/models/bge-large-zh-v1.5

volumes:
  mysql_data:
  es_data:
  qdrant_data:
