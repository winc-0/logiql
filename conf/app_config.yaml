# 仓配自助问数 应用配置
#
# 敏感信息一律通过环境变量注入（OmegaConf 的 oc.env 插值），
# 不在配置文件中硬编码。复制 .env.example 为 .env 后填入实际值即可。
#
# 需要的环境变量见 .env.example

logging:
  file:
    enable: true
    level: INFO
    path: logs
    rotation: "10 MB"
    retention: "7 days"
  console:
    enable: true
    level: INFO

db_meta:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3306}
  user: ${oc.env:MYSQL_USER,zhishu}
  password: ${oc.env:MYSQL_PASSWORD}
  database: meta

db_dw:
  host: ${oc.env:MYSQL_HOST,localhost}
  port: ${oc.env:MYSQL_PORT,3306}
  user: ${oc.env:MYSQL_USER,zhishu}
  password: ${oc.env:MYSQL_PASSWORD}
  database: dw

qdrant:
  host: ${oc.env:QDRANT_HOST,localhost}
  port: ${oc.env:QDRANT_PORT,6333}
  embedding_size: ${oc.env:EMBEDDING_SIZE,1024}

embedding:
  host: ${oc.env:EMBEDDING_HOST,localhost}
  port: ${oc.env:EMBEDDING_PORT,8081}
  model: ${oc.env:EMBEDDING_MODEL,BAAI/bge-large-zh-v1.5}

es:
  host: ${oc.env:ES_HOST,localhost}
  port: ${oc.env:ES_PORT,9200}
  index_name: ${oc.env:ES_INDEX_NAME,zhishu_values}

llm:
  model_name: ${oc.env:LLM_MODEL_NAME,qwen-plus}
  api_key: ${oc.env:LLM_API_KEY}
  base_url: ${oc.env:LLM_BASE_URL,https://dashscope.aliyuncs.com/compatible-mode/v1}
