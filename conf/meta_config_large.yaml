      - name: usage_type
        role: dimension
        description: 库区用途，取值为存储区、拣货区、复核区、退货区
        alias: [ '库区用途' ]
        sync: true


  - name: dim_equipment
    role: dim
    description: 仓储装备维度表，描述仓内叉车、AGV、分拣线等装备的型号与额定参数。这是**装备资产**数据，与出库单据没有直接关联，不能用来统计出库业务量。
