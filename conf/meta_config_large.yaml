      - name: origin_warehouse_id
        role: foreign_key
        description: 起点仓ID
        alias: [ '起点仓' ]
        sync: false

      - name: dest_city
        role: dimension
        description: 终点城市
        alias: [ '终点', '到达城市' ]
        sync: true

      - name: distance_km
        role: measure
        description: 线路里程（公里）
        alias: [ '里程', '距离' ]
