  - name: dim_cargo_sku
    role: dim
    description: 货品规格（SKU）维度表，描述同一个货品下的不同规格包装变体。**粒度是货品之下的规格**，比 dim_cargo 更细：统计品类或品牌口径时不要 JOIN 本表，否则会把同一货品重复计数。
    columns:
