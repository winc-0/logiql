tables:
  - name: dim_warehouse
    role: dim
    description: 仓库维度表，描述第三方仓配服务商在全国运营的仓库及其属性，用于按仓、按大区、按仓型统计履约结果。
    columns:
      - name: warehouse_id
        role: primary_key
        description: 仓库唯一标识。
        alias: [ 仓库ID, 仓编码 ]
        sync: false

      - name: warehouse_name
        role: dimension
        description: 仓库名称，如华北1仓、华东1仓。用户说「华北1仓」「1仓」时匹配本列。
        alias: [ 仓库名称, 仓名, 哪个仓 ]
        sync: true

      - name: region_name
        role: dimension
        description: 仓库所属大区，取值为华北、华东、华南、华中、西南。用户问「华北」时按本列筛选。
        alias: [ 大区, 区域, 片区 ]
        sync: true

      - name: city
        role: dimension
        description: 仓库所在城市，如北京、上海、广州、杭州、天津、深圳、武汉、成都。
        alias: [ 城市, 所在城市, 开仓城市 ]
        sync: true

      - name: warehouse_type
        role: dimension
        description: 仓型，取值为中心仓、区域仓、前置仓、冷链仓。冷链仓只处理生鲜品类。
        alias: [ 仓型, 仓库类型, 类型 ]
        sync: true


  - name: dim_cargo
    role: dim
    description: 货品维度表，描述托管在仓库中的货物属性，用于按品类、按品牌统计出库结构。
    columns:
      - name: cargo_id
        role: primary_key
        description: 货品唯一标识。
        alias: [ 货品ID, 货物ID ]
        sync: false

      - name: cargo_name
        role: dimension
        description: 货品名称，如智能手机、变频空调、进口牛排。
        alias: [ 货品名称, 商品名称, 货名 ]
        sync: true

      - name: cargo_category
        role: dimension
        description: 货品品类，取值为3C数码、家用电器、服装服饰、食品饮料、生鲜冷链、家居建材、美妆个护、母婴用品。
        alias: [ 品类, 类别, 货类 ]
        sync: true

      - name: cargo_brand
        role: dimension
        description: 货品所属品牌，如华为、苹果、小米、美的、海尔、耐克、波司登、蒙牛、兰蔻、欧莱雅。
        alias: [ 品牌, 牌子 ]
        sync: true

      - name: unit_price
        role: dimension
        description: 货品单价（元），是货品的固有属性，不是出库单的成交金额。统计出库货值应使用事实表的 outbound_amount。
        alias: [ 单价, 货值单价 ]
        sync: false

      - name: unit_weight_kg
        role: dimension
        description: 货品单件重量（kg），影响运费计算，本身不作为统计指标。
        alias: [ 单件重量, 件重 ]
        sync: false


  - name: dim_shipper
    role: dim
    description: 货主维度表，描述委托第三方仓配服务的发货客户（货主）及其等级，用于按客户统计出库量。
    columns:
      - name: shipper_id
        role: primary_key
        description: 货主唯一标识。
        alias: [ 货主ID, 客户ID ]
        sync: false

      - name: shipper_name
        role: dimension
        description: 货主名称，如京东零售、小米科技、美的集团。
        alias: [ 货主名称, 客户名称, 发货方 ]
        sync: true

      - name: shipper_level
        role: dimension
        description: 客户等级，取值为战略、核心、普通。等级越高出货量越大。
        alias: [ 客户等级, 货主等级, 等级 ]
        sync: true

      - name: industry
        role: dimension
        description: 货主所属行业，如电商零售、3C制造、家电制造、服装纺织、食品饮料、生鲜供应、家居建材、美妆个护、母婴用品。
        alias: [ 行业, 所属行业 ]
        sync: true


  - name: dim_carrier
    role: dim
    description: 承运商维度表，描述承担干线与末端派送的承运商及其时效产品，用于按承运商统计妥投质量。
    columns:
      - name: carrier_id
        role: primary_key
        description: 承运商唯一标识。
        alias: [ 承运商ID, 快递ID ]
        sync: false

      - name: carrier_name
        role: dimension
        description: 承运商名称，如顺丰速运、京东物流、中通快运、圆通速递、德邦物流、邮政EMS。
        alias: [ 承运商, 快递公司, 物流公司 ]
        sync: true

      - name: carrier_type
        role: dimension
        description: 承运商类型，取值为自营、加盟、专线、快运网络。
        alias: [ 承运商类型, 合作模式 ]
        sync: true

      - name: service_level
        role: dimension
        description: 承运商主打时效产品，取值为次日达、隔日达、标准陆运、经济。时效越快运费越高。
        alias: [ 时效产品, 时效, 服务等级 ]
        sync: true


  - name: dim_date
    role: dim
    description: 日期维度表，描述出库日期的年月季度属性，用于时间范围筛选与趋势分组。
    columns:
      - name: date_id
        role: primary_key
        description: 日期唯一标识，格式为 YYYYMMDD 的整数，与出库事实表的 date_id 关联。
        alias: [ 日期ID ]
        sync: false

      - name: year
        role: dimension
        description: 年份，如2024、2025。
        alias: [ 年, 年份 ]
        sync: true

      - name: quarter
        role: dimension
        description: 季度，取值为Q1、Q2、Q3、Q4。
        alias: [ 季度 ]
        sync: true

      - name: month
        role: dimension
        description: 月份，取值1到12。
        alias: [ 月, 月份 ]
        sync: false

      - name: day
        role: dimension
        description: 日，取值1到31。
        alias: [ 日, 天 ]
        sync: false


  - name: fact_outbound
    role: fact
    description: 出库单事实表，记录每一笔出库单的货值、件数、运费与最终履约结果。
      出库时写入，妥投后回填时效与妥投结果，是统计出库量、妥投率、时效的核心表。
    columns:
      - name: outbound_id
        role: primary_key
        description: 出库单唯一标识。统计出库单量时对出库单号去重计数，或直接 COUNT(*)。
        alias: [ 出库单号, 出库单ID, 运单号, 单号 ]
        sync: false

      - name: shipper_id
        role: foreign_key
        description: 关联货主维度的外键。
        alias: [ 货主ID, 客户ID ]
        sync: false

      - name: cargo_id
        role: foreign_key
        description: 关联货品维度的外键。
        alias: [ 货品ID, 商品ID ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 关联时间维度的外键，表示出库日期。
        alias: [ 日期, 出库日期 ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 关联仓库维度的外键，表示出库仓。
        alias: [ 仓库ID, 出库仓ID ]
        sync: false

      - name: carrier_id
        role: foreign_key
        description: 关联承运商维度的外键，表示承担本单派送的承运商。
        alias: [ 承运商ID ]
        sync: false

      - name: outbound_quantity
        role: measure
        description: 该出库单的出库件数。统计「出库了多少件」时用本列求和。
        alias: [ 出库件数, 件数, 出库数量 ]
        sync: false

      - name: outbound_amount
        role: measure
        description: 该出库单的出库货值（元），等于货品单价乘以件数。这是出库货物的价值，
          不是运费，也不是服务收入；问「运费」「成本」时不要使用本列。
        alias: [ 出库货值, 出库金额, 货值, 金额 ]
        sync: false

      - name: outbound_hours
        role: measure
        description: 出库时效，从货主下单到完成出库的小时数。数值越小越好。
        alias: [ 出库时效, 出库时长, 备货时长 ]
        sync: false

      - name: is_ontime_outbound
        role: measure
        description: 是否按时出库标记，1 表示出库时效在 24 小时内，0 表示超时。
          求出库及时率时用 SUM(本列) / COUNT(*)，不能直接求和当数量用。
        alias: [ 是否按时出库, 出库及时标记 ]
        sync: false

      - name: delivery_hours
        role: measure
        description: 妥投时长，从出库到签收的小时数。未妥投的单据该值为 0，
          求平均妥投时长时应先过滤 is_delivered = 1，否则 0 值会把均值拉低。
        alias: [ 妥投时长, 派送时长, 送达时长 ]
        sync: false

      - name: is_delivered
        role: measure
        description: 是否妥投标记，1 表示已签收，0 表示丢件或拒收。
          求妥投率时用 SUM(本列) / COUNT(*)。
        alias: [ 是否妥投, 是否签收, 妥投标记 ]
        sync: false

      - name: is_ontime_delivery
        role: measure
        description: 是否准时妥投标记，1 表示在承运商承诺时效内完成签收，0 表示超时。
          求妥投及时率（准时率）时用 SUM(本列) / COUNT(*)。
        alias: [ 是否准时妥投, 准时妥投标记, 是否及时 ]
        sync: false

      - name: freight_amount
        role: measure
        description: 该出库单的运费（元），由首重费加续重费构成，时效越快的承运商费率越高。
          这是本单发生的物流成本，与出库货值是两个完全不同的口径，不可混用。
        alias: [ 运费, 物流费用, 配送费 ]
        sync: false

# ---------------------------------------------------------------------------
# 以下 tables 由 scripts/gen_dw_large.py 追加，用于把 schema 从 6 表扩到 32 表。
# 原 6 张表的定义保持原样不动，保证 56 道评测题的 gold SQL 不受影响。
# ---------------------------------------------------------------------------

  - name: ods_waybill_raw
    role: fact
    description: 贴源层原始运单表，由 TMS 业务库直接同步而来，未经任何清洗：含测试单、重复单与异常货值。本表仅用于数据溯源与问题排查，**不参与对外口径的业务统计**。若要做出库货值、出库单量等正式口径分析，请使用 fact_outbound（已清洗的事实明细）。
    columns:
      - name: raw_id
        role: primary_key
        description: 原始记录自增ID
        alias: [ '原始ID' ]
        sync: false

      - name: waybill_no
        role: dimension
        description: 业务系统原始运单号
        alias: [ '原始运单号', '运单号' ]
        sync: false

      - name: cargo_id
        role: foreign_key
        description: 货品标识
        alias: [ '货品ID' ]
        sync: false

      - name: shipper_id
        role: foreign_key
        description: 货主标识
        alias: [ '货主ID' ]
        sync: false

      - name: ship_date
        role: dimension
        description: 发货日期
        alias: [ '发货日期' ]
        sync: false

      - name: amount_raw
        role: measure
        description: 未清洗的原始货值，含测试单与异常单，不可用于正式口径统计
        alias: [ '原始货值' ]
        sync: false

      - name: weight_raw
        role: measure
        description: 未清洗的原始重量，含异常值，不可用于正式口径统计
        alias: [ '原始重量' ]
        sync: false

      - name: is_test
        role: dimension
        description: 是否为测试单标记，1 表示测试单
        alias: [ '测试标记' ]
        sync: true

      - name: load_time
        role: dimension
        description: 同步入库时间
        alias: []
        sync: false


  - name: dws_outbound_daily
    role: fact
    description: 出库日汇总表，按「日期 + 仓库 + 品类」粒度预聚合每日的出库结果，用于加速固定看板的查询。**已聚合，无法下钻到单笔出库单、单个货主或单个货品**。注意覆盖边界：本表由离线任务回溯生成，当前仅汇总到 2025 年 9 月，2025 年 10 月之后的数据缺失；涉及 2025Q4 或全年合计的统计不能用本表，必须回到 fact_outbound。
    columns:
      - name: stat_date
        role: primary_key
        description: 统计日期，关联 dim_date
        alias: [ '汇总日期' ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 出库仓ID
        alias: [ '仓库ID' ]
        sync: false

      - name: category
        role: dimension
        description: 货品品类
        alias: [ '品类', '类别' ]
        sync: true

      - name: daily_outbound_amount
        role: measure
        description: 当日出库货值合计，已聚合，不能下钻到单笔出库单
        alias: [ '每日出库货值', '汇总货值' ]
        sync: false

      - name: daily_outbound_count
        role: measure
        description: 当日出库单量，已聚合
        alias: [ '每日出库单量' ]
        sync: false

      - name: daily_quantity
        role: measure
        description: 当日出库件数合计，已聚合
        alias: [ '每日出库件数' ]
        sync: false


  - name: fact_outbound_item
    role: fact
    description: 出库单明细表，一张出库单可能拆成多行（不同货品或分批出库），粒度比 fact_outbound 更细。**在明细表上直接 COUNT(*) 会把单量夸大**——统计出库单量应回到 fact_outbound，本表只用于分析明细行级别的结构。
    columns:
      - name: item_id
        role: primary_key
        description: 明细行自增ID
        alias: [ '明细ID' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 所属出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: cargo_id
        role: foreign_key
        description: 货品标识
        alias: [ '货品ID' ]
        sync: false

      - name: item_quantity
        role: measure
        description: 该明细行的出库件数
        alias: [ '明细件数' ]
        sync: false

      - name: item_amount
        role: measure
        description: 该明细行的出库货值，同一出库单多行相加等于主表的出库货值
        alias: [ '明细金额' ]
        sync: false

      - name: discount_rate
        role: measure
        description: 折扣率，0.9 表示九折，用于分析折扣结构，不是金额
        alias: [ '折扣' ]
        sync: false


  - name: fact_delivery
    role: fact
    description: 派送事实表，记录出库单交给承运商之后的实际派送过程（派送员、派送次数、派送状态）。本表是**过程表**，一笔出库单可能产生多条派送记录（首次派送失败会再次派送）；统计派送单量前先确认是否需要去重。最终是否送到要看 fact_outbound 的妥投标记。
    columns:
      - name: delivery_id
        role: primary_key
        description: 派送记录自增ID
        alias: [ '派送ID' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: carrier_id
        role: foreign_key
        description: 承运商ID
        alias: [ '承运商ID' ]
        sync: false

      - name: courier_name
        role: dimension
        description: 派送员姓名
        alias: [ '派送员', '快递员' ]
        sync: true

      - name: dispatch_hours
        role: measure
        description: 出库到开始派送的小时数
        alias: [ '派送响应时长' ]
        sync: false

      - name: delivery_status
        role: dimension
        description: 派送状态，取值为已签收、在途、拒收、派送失败
        alias: [ '派送状态', '配送状态' ]
        sync: true

      - name: attempt_count
        role: measure
        description: 累计派送次数，大于 1 表示首次未成功
        alias: [ '派送次数' ]
        sync: false


  - name: fact_signoff
    role: fact
    description: 签收事实表，记录出库单的最终签收结果（签收方式、是否本人签收、是否异常签收）。本表只包含**已签收**的单据，未签收（丢件、拒收）的单据不在此表，因此用本表统计妥投率会偏高——统计妥投率应使用 fact_outbound 的 is_delivered 标记。
    columns:
      - name: signoff_id
        role: primary_key
        description: 签收记录自增ID
        alias: [ '签收ID' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: signoff_date
        role: foreign_key
        description: 签收日期，关联 dim_date
        alias: [ '签收日期' ]
        sync: false

      - name: signoff_type
        role: dimension
        description: 签收方式，取值为本人签收、他人代收、驿站代收、智能柜
        alias: [ '签收方式' ]
        sync: true

      - name: is_self_sign
        role: measure
        description: 是否本人签收标记，1 表示本人签收
        alias: [ '本人签收' ]
        sync: false

      - name: is_exception
        role: measure
        description: 是否异常签收标记，1 表示签收时就发现了破损或短少
        alias: [ '异常签收' ]
        sync: false


  - name: fact_inbound
    role: fact
    description: 入库事实表，记录供应商送货到仓并完成验收的入库单。是「入库」这一动作的事实表，与出库方向的 fact_outbound 是**相反的两个业务动作**，统计「单量」时必须先分清方向。
    columns:
      - name: inbound_id
        role: primary_key
        description: 入库单自增ID
        alias: [ '入库单号' ]
        sync: false

      - name: supplier_id
        role: foreign_key
        description: 供应商ID
        alias: [ '供应商ID' ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 收货仓库ID
        alias: [ '仓库ID' ]
        sync: false

      - name: cargo_id
        role: foreign_key
        description: 货品ID
        alias: [ '货品ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 入库日期，关联 dim_date
        alias: [ '入库日期' ]
        sync: false

      - name: inbound_quantity
        role: measure
        description: 入库件数
        alias: [ '入库数量' ]
        sync: false

      - name: accept_hours
        role: measure
        description: 到货到验收完成的小时数，衡量收货效率
        alias: [ '验收时长' ]
        sync: false

      - name: is_qualified
        role: measure
        description: 验收是否合格标记，1 表示合格
        alias: [ '验收合格' ]
        sync: false


  - name: fact_inventory_daily
    role: fact
    description: 库存日快照表，按「货品 + 仓库 + 日期」记录每日闭仓时的在库件数与在库货值。**是快照不是流水**，同一批货在多个日期会重复出现，跨日期直接求和会重复计算；要看某一天的库存就限定单日，看周转则要用平均库存。
    columns:
      - name: snapshot_id
        role: primary_key
        description: 快照自增ID
        alias: [ '快照ID' ]
        sync: false

      - name: cargo_id
        role: foreign_key
        description: 货品ID
        alias: [ '货品ID' ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 仓库ID
        alias: [ '仓库ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 库存日期，关联 dim_date
        alias: [ '库存日期' ]
        sync: false

      - name: stock_quantity
        role: measure
        description: 当日闭仓在库件数，跨日期求和会重复计算
        alias: [ '在库件数', '库存数量' ]
        sync: false

      - name: stock_amount
        role: measure
        description: 当日闭仓在库货值，跨日期求和会重复计算
        alias: [ '在库货值', '库存金额' ]
        sync: false

      - name: stock_days
        role: measure
        description: 库龄天数，衡量货物在仓存放了多久
        alias: [ '库龄' ]
