        alias: [ '目的大区', '大区' ]
        sync: true

      - name: city
        role: dimension
        description: 收货城市
        alias: [ '目的城市', '城市' ]
        sync: true

      - name: is_remote
        role: dimension
        description: 是否偏远地区标记，1 表示偏远，偏远地区时效更长
        alias: [ '偏远地区' ]
        sync: true


  - name: dim_transport_line
    role: dim
    description: 干线线路维度表，描述仓库之间的固定运输线路及其里程与承诺时效。
    columns:
      - name: line_id
        role: primary_key
