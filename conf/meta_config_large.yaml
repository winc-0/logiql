        role: dimension
        description: 供应商所在城市
        alias: [ '供应商城市' ]
        sync: true


metrics:
  - name: OUTBOUND_COUNT
    description: 出库单量，指完成的出库单笔数，等价于对出库单号去重计数 COUNT(outbound_id)。
      在 fact_outbound 上直接 COUNT(*) 即为本指标。
    relevant_columns:
      - fact_outbound.outbound_id
    alias: [ 出库单量, 出库量, 出库笔数, 单量 ]

  - name: OUTBOUND_AMOUNT
    description: 出库货值，指所有出库单的出库金额总和，等于 SUM(outbound_amount)。
      注意这是托管货物的价值，不是公司的服务收入，也不等于运费。
    relevant_columns:
      - fact_outbound.outbound_amount
    alias: [ 出库货值, 出库金额, 货值 ]

  - name: DELIVERY_ONTIME_RATE
    description: 妥投及时率，指在承诺时效内完成签收的出库单占比，
      等于 SUM(is_ontime_delivery) / COUNT(*)，结果通常按百分比展示。
      注意分子是标记列求和，不是对时长求平均；问「平均多久送到」应改用妥投时长。
    relevant_columns:
      - fact_outbound.is_ontime_delivery
    alias: [ 妥投及时率, 准时率, 及时率, 妥投率 ]

  - name: INBOUND_COUNT
    description: 入库单量，指供应商送货入库的单据笔数，方向是「货进仓」。与出库单量是相反的两个业务动作，问「出库了多少单」时不能用本指标。
    relevant_columns:
      - fact_inbound.inbound_id
    alias: [ 入库单量, 入库量, 收货单量 ]

  - name: SIGN_RATE
    description: 妥投率（签收率），指最终成功签收的出库单占比，等于 SUM(is_delivered) / COUNT(*)。注意它只回答「送到没有」，不回答「按时送到没有」——问「及时率」「准时率」应改用 DELIVERY_ONTIME_RATE。
    relevant_columns:
      - fact_outbound.is_delivered
    alias: [ 妥投率, 签收率, 送达率 ]

  - name: CLAIM_AMOUNT
    description: 理赔金额，指因破损、丢失、延误等异常而实际赔付的金额总和，是负向指标。只有在问题明确提到「理赔」「赔付」时才使用；常规的出库货值、出库单量统计不扣减理赔，也不应 JOIN 理赔表。
    relevant_columns:
      - fact_claim.claim_amount
    alias: [ 理赔额, 赔付金额, 理赔金额 ]

  - name: PAID_FREIGHT
    description: 实付运费，指与承运商结算后扣除争议与理赔实际支付的运费，通常小于应付运费。与出库单上的 freight_amount（对客户应收运费）是成本与收入两个方向，绝不可混用；泛泛地问「运费多少」默认指出库单上的应收运费。
    relevant_columns:
      - fact_freight_settle.paid_freight
    alias: [ 实付运费, 结算运费 ]

  - name: PICKING_EFFICIENCY
    description: 拣货效率，指单位时间完成的拣货行数，等于拣货行数除以拣货耗时（换算为小时）。这是仓内作业效率指标，与出库业务量无关；问「出库了多少」时不使用。
    relevant_columns:
      - fact_picking.pick_lines
      - fact_picking.pick_minutes
    alias: [ 拣货效率, 人效, 拣货人效 ]
