  - name: fact_picking
    role: fact
    description: 拣货作业事实表，记录仓内操作员按出库单拣货的作业量与差错情况。这是**仓内作业**数据，与出库单本身是一对多的关系（一张出库单可能多人分捡），统计出库单量不要使用本表。
    columns:
      - name: picking_id
        role: primary_key
        description: 拣货记录自增ID
        alias: [ '拣货ID' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: staff_id
        role: foreign_key
        description: 拣货员ID
        alias: [ '员工ID' ]
        sync: false

      - name: shift_id
        role: foreign_key
        description: 班次ID
        alias: [ '班次ID' ]
        sync: false

      - name: pick_lines
        role: measure
        description: 拣货行数
        alias: [ '拣货行数' ]
        sync: false

      - name: pick_minutes
        role: measure
        description: 拣货耗时（分钟）
        alias: [ '拣货时长' ]
        sync: false

      - name: error_lines
        role: measure
        description: 拣货差错行数，衡量拣货质量
        alias: [ '差错行数' ]
        sync: false


  - name: fact_equipment_op
    role: fact
    description: 仓储装备作业事实表，记录叉车、AGV、分拣线等装备每日的运行与能耗。这是**装备运行**数据，与出库业务没有单据级关联，不能用来统计出库量或运费。
    columns:
      - name: op_id
        role: primary_key
        description: 作业记录自增ID
        alias: [ '作业ID' ]
        sync: false

      - name: equipment_id
        role: foreign_key
        description: 装备ID
        alias: [ '设备ID' ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 所在仓库ID
        alias: [ '仓库ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 作业日期，关联 dim_date
        alias: [ '作业日期' ]
        sync: false

      - name: run_hours
        role: measure
        description: 当日运行时长（小时）
        alias: [ '运行时长' ]
        sync: false

      - name: energy_kwh
        role: measure
        description: 当日能耗（度）
        alias: [ '能耗', '用电量' ]
        sync: false

      - name: fault_count
        role: measure
        description: 当日故障次数
        alias: [ '故障次数' ]
        sync: false


  - name: fact_claim
    role: fact
    description: 异常理赔事实表，记录出库单发生破损、丢失、延误等异常后的理赔申请与处理结果。这是**负向指标**表：常规的出库货值、出库单量统计不扣减理赔，也不应 JOIN 本表；只有在问题明确提到「理赔」「赔付」「异常件」时才使用。
    columns:
      - name: claim_id
        role: primary_key
        description: 理赔单号
        alias: [ '理赔单号', '异常单号' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 关联出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: claim_type_id
        role: foreign_key
        description: 异常类型ID
        alias: [ '异常类型ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 报案日期，关联 dim_date
        alias: [ '报案日期' ]
        sync: false

      - name: claim_amount
        role: measure
        description: 理赔金额，负向指标，常规出库统计不扣减
        alias: [ '理赔额', '赔付金额' ]
        sync: false

      - name: claim_status
        role: dimension
        description: 处理状态，取值为已赔付、审核中、已驳回
        alias: [ '理赔状态' ]
        sync: true

      - name: resolve_hours
        role: measure
        description: 报案到结案的小时数
        alias: [ '理赔处理时长' ]
        sync: false


  - name: fact_return
    role: fact
    description: 退货入库事实表，记录被拒收或退回的货物回到仓库的入库记录。这是**逆向物流**数据，与正向出库方向相反；统计出库量时绝不能把退货算进去。
    columns:
      - name: return_id
        role: primary_key
        description: 退货入库自增ID
        alias: [ '退货ID' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 原出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 退回仓库ID
        alias: [ '仓库ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 退回日期，关联 dim_date
        alias: [ '退货日期' ]
        sync: false

      - name: return_quantity
        role: measure
        description: 退回件数，逆向数据，不能计入出库件数
        alias: [ '退货件数' ]
        sync: false

      - name: return_reason
        role: dimension
        description: 退货原因，如拒收、地址错误、客户取消、质量问题
        alias: [ '退货原因' ]
        sync: true

      - name: is_reshelved
        role: measure
        description: 是否已二次上架标记，1 表示已重新上架可售
        alias: [ '二次上架' ]
        sync: false


  - name: fact_transport
    role: fact
    description: 干线运输事实表，按「线路 + 车次 + 日期」记录仓库之间的干线发运情况。这是**仓间调拨**层面的数据，与面向客户的出库单不在同一粒度，统计出库单量或妥投率不使用本表。
    columns:
      - name: transport_id
        role: primary_key
        description: 车次自增ID
        alias: [ '车次ID' ]
        sync: false

      - name: line_id
        role: foreign_key
        description: 干线线路ID
        alias: [ '线路ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 发运日期，关联 dim_date
        alias: [ '发运日期' ]
        sync: false

      - name: vehicle_no
        role: dimension
        description: 车牌号
        alias: [ '车牌' ]
        sync: false

      - name: shipment_count
        role: measure
        description: 本车搭载的出库单量，是干线口径不是客户口径
        alias: [ '发运单量' ]
        sync: false

      - name: volume_m3
        role: measure
        description: 发运体积（立方米）
        alias: [ '发运体积' ]
        sync: false

      - name: is_ontime
        role: measure
        description: 是否准点到达标记，1 表示准点
        alias: [ '干线准点' ]
        sync: false


  - name: fact_freight_settle
    role: fact
    description: 运费结算事实表，记录与承运商按单结算的运费结果，含应付、增值服务费与实付三个金额。**金额口径说明**：fact_outbound.freight_amount 是对客户应收的运费，本表的 payable_freight 是对承运商应付的成本，两者是收入与成本的区别，绝不可混用；paid_freight 是扣除争议与理赔后的实付金额，通常小于 payable_freight。
    columns:
      - name: settle_id
        role: primary_key
        description: 结算自增ID
        alias: [ '结算ID' ]
        sync: false

      - name: outbound_id
        role: foreign_key
        description: 出库单号
        alias: [ '出库单号' ]
        sync: false

      - name: carrier_id
        role: foreign_key
        description: 承运商ID
        alias: [ '承运商ID' ]
        sync: false

      - name: payable_freight
        role: measure
        description: 应付运费（对承运商的成本），与出库单上的应收运费是相反口径
        alias: [ '应付运费' ]
        sync: false

      - name: extra_fee
        role: measure
        description: 增值服务费，含上楼费、保价费、超区派送费
        alias: [ '增值服务费', '附加费' ]
        sync: false

      - name: paid_freight
        role: measure
        description: 实付运费，扣除争议与理赔后实际支付的金额，通常小于应付运费
        alias: [ '实付运费' ]
        sync: false

      - name: settle_status
        role: dimension
        description: 结算状态，取值为已结算、对账中、有争议
        alias: [ '结算状态' ]
        sync: true

      - name: date_id
        role: foreign_key
        description: 结算日期，关联 dim_date
        alias: [ '结算日期' ]
        sync: false


  - name: fact_warehouse_cost
    role: fact
    description: 仓成本事实表，按「仓库 + 月份」记录仓储运营发生的各项成本。这是**成本**数据，与出库货值（托管货物价值）是完全不同的两个口径，不可混用；问「出库货值」「出库单量」时不要使用本表。
    columns:
      - name: cost_id
        role: primary_key
        description: 成本记录自增ID
        alias: [ '成本ID' ]
        sync: false

      - name: warehouse_id
        role: foreign_key
        description: 仓库ID
        alias: [ '仓库ID' ]
        sync: false

      - name: date_id
        role: foreign_key
        description: 成本所属月份，关联 dim_date
        alias: [ '成本月份' ]
        sync: false

      - name: storage_fee
        role: measure
        description: 仓储费（库租），按月发生
        alias: [ '仓储费', '库租' ]
        sync: false

      - name: operation_fee
        role: measure
        description: 操作费，含出入库作业产生的费用
        alias: [ '操作费' ]
        sync: false

      - name: labor_cost
        role: measure
        description: 人力成本
        alias: [ '人工成本' ]
        sync: false

      - name: energy_cost
        role: measure
        description: 能耗成本，含制冷与照明用电
        alias: [ '能耗成本' ]
        sync: false


  - name: dim_consignee
    role: dim
    description: 收货人维度表，描述包裹的最终收件方，用于分析末端派送的收件特征。
