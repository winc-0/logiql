        description: 收货人姓名
        alias: [ '收货人', '收件人' ]
        sync: true

      - name: phone_masked
        role: dimension
        description: 脱敏后的手机号
        alias: [ '手机号' ]
        sync: false

      - name: dest_id
        role: foreign_key
        description: 目的地区域ID
        alias: [ '目的地ID' ]
        sync: false

      - name: consignee_type
        role: dimension
        description: 收货人类型，取值为个人、企业、驿站
        alias: [ '收货人类型' ]
        sync: true


  - name: dim_destination
    role: dim
    description: 目的地区域维度表，描述包裹送达方向所在的省市区，以及是否属于偏远地区。注意与 dim_warehouse 的区别：本表描述**货送到哪里**，dim_warehouse 描述**货从哪个仓发出**。
    columns:
