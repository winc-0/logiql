      - name: promise_hours
        role: measure
        description: 该线路的承诺时效（小时）
        alias: [ '线路时效' ]
        sync: false


  - name: dim_service_level
    role: dim
    description: 时效产品维度表，描述公司对外承诺的时效档次及其对应小时数。注意与 dim_carrier.service_level 的区别：本表是可售卖的**产品档位**，承运商表上的 service_level 只是该承运商的主打档位，统计应按时效产品走本表。
    columns:
      - name: level_id
        role: primary_key
        description: 时效产品ID
        alias: [ '时效ID' ]
        sync: false

      - name: level_name
        role: dimension
        description: 时效产品名称，取值为次日达、隔日达、标准陆运、经济
        alias: [ '时效产品', '时效档位' ]
        sync: true

      - name: promise_hours
        role: measure
        description: 该时效产品的承诺小时数
        alias: [ '承诺时效' ]
        sync: false

      - name: is_cold_chain
        role: dimension
        description: 是否冷链产品标记，1 表示冷链
        alias: [ '冷链' ]
        sync: true


  - name: dim_claim_type
    role: dim
    description: 异常类型维度表，描述理赔与异常件的分类及其赔付规则。
